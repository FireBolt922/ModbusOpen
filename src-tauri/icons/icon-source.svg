<!--
  Master source for all ModbusOpen app icons.
  Derived from public/logo.svg; the mark is nudged 8px left so it sits
  optically centred in the square tile. Regenerate the icon set with:
      pnpm icons
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="ModbusOpen">
  <defs>
    <linearGradient id="logo-bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6"/>
      <stop offset="0.55" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="logo-sheen" x1="28" y1="12" x2="96" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#99F6E4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#99F6E4" stop-opacity="0"/>
    </linearGradient>
    <filter id="logo-soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="b"/>
      <feOffset dy="1"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded app mark -->
  <rect width="128" height="128" rx="32" fill="url(#logo-bg)"/>
  <rect width="128" height="128" rx="32" fill="url(#logo-sheen)"/>

  <g filter="url(#logo-soft)" transform="translate(-8 0)">
    <!-- Left bus rail -->
    <path
      d="M36 34v60"
      stroke="#F0FDFA"
      stroke-width="7"
      stroke-linecap="round"
    />
    <!-- Top register channel (closed node) -->
    <path
      d="M36 40h38a8 8 0 0 1 8 8v0a8 8 0 0 1-8 8H36"
      stroke="#F0FDFA"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Middle channel (primary / active) -->
    <path
      d="M36 64h46a8 8 0 0 1 8 8v0a8 8 0 0 1-8 8H36"
      stroke="#CCFBF1"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Bottom channel (open — the "Open" in ModbusOpen) -->
    <path
      d="M36 88h30a8 8 0 0 0 8-8"
      stroke="#5EEAD4"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Endpoint nodes -->
    <circle cx="94" cy="48" r="6.5" fill="#F0FDFA"/>
    <circle cx="102" cy="72" r="6.5" fill="#CCFBF1"/>
    <circle cx="82" cy="88" r="5" fill="#5EEAD4" opacity="0.9"/>
  </g>
</svg>
