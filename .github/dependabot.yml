version: 2
updates:
  # Minor + patch bumps arrive as one grouped PR per ecosystem per month.
  # Major bumps are left out of the group so each gets its own PR — one
  # breaking upgrade shouldn't hold back every safe one.
  #
  # Tauri: the @tauri-apps/* npm packages and the tauri* Rust crates must stay
  # on the same major/minor, and Dependabot updates npm and cargo in separate
  # PRs, so only patch bumps are automatic. Upgrade Tauri minors by hand, both
  # sides in one PR (CI's "tauri versions aligned" step checks this).
  - package-ecosystem: npm # also covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
