name: ci

on:
  workflow_dispatch:
  # The release workflow runs this as its test gate before bumping anything.
  workflow_call:
  pull_request:
    branches: [main]
  # Every branch, so a push gets feedback before a PR exists. Tags are left
  # out: a release tag is only pushed after these checks already passed.
  push:
    branches: ["**"]

# Read-only token: this runs on PRs from forks once the repo is public.
permissions:
  contents: read

# A new push to the same branch/PR cancels the in-flight run instead of
# queueing. `github.workflow` is the *caller's* name under workflow_call, so a
# release's test run never cancels (or is cancelled by) a normal push run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: install pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            pkg-config

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: script tests
        run: pnpm test:scripts

      # `tauri build` refuses to run when the @tauri-apps/* npm packages and
      # their Rust crates are on different major/minor versions, but `pnpm
      # build` doesn't care — catch it here instead of in the release run.
      # `tauri info` reports the mismatch yet still exits 0, hence the grep.
      - name: tauri versions aligned
        run: |
          pnpm tauri info 2>&1 | tee tauri-info.txt
          if grep -q "version mismatched Tauri packages" tauri-info.txt; then
            echo "::error::@tauri-apps/* npm packages and Tauri Rust crates are on different major/minor versions"
            exit 1
          fi

      - name: build
        run: pnpm build

      - name: cargo fmt -- --check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
