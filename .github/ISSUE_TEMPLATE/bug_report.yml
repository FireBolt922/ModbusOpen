name: Bug report
description: Something doesn't work, shows a wrong value, or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ModbusOpen version
      placeholder: e.g. 1.1.1 (Help → About, or the release you downloaded)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [Modbus TCP, Modbus RTU (serial), Not connection-related]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Make and model of the meter/PLC/VFD, or "test rig" if you used testrig/slave.py.
  - type: textarea
    id: frames
    attributes:
      label: Frame log / registers
      description: Paste the relevant lines from the frame log, plus the register address, data type and word order you used.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, logs, or the .mbmeter.json you were using.
