<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="ModbusOpen">
  <defs>
    <linearGradient id="mo-bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="mo-sheen" x1="8" y1="4" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect width="32" height="32" rx="8" fill="url(#mo-bg)"/>
  <rect width="32" height="32" rx="8" fill="url(#mo-sheen)"/>
  <!-- Open register bus: left rail, three live channels, open right -->
  <path
    d="M9 8.5v15"
    stroke="#F0FDFA"
    stroke-width="2"
    stroke-linecap="round"
  />
  <path
    d="M9 10h9.5a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2H9"
    stroke="#F0FDFA"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M9 16h11.5a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2H9"
    stroke="#99F6E4"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M9 22h7.5a2 2 0 0 0 2-2"
    stroke="#5EEAD4"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Live pulse / open node -->
  <circle cx="23.5" cy="12" r="1.75" fill="#F0FDFA"/>
  <circle cx="23.5" cy="18" r="1.75" fill="#99F6E4"/>
</svg>
